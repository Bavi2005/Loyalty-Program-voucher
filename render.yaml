# Render Blueprint — one-click backend + database
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: loyalty-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: loyalty-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://bavi2005.github.io
      - key: CORS_ORIGINS
        value: "https://bavi2005.github.io,http://localhost:8080"
      - key: PORT
        value: 5000

databases:
  - name: loyalty-db
    plan: free
    databaseName: loyalty
    user: loyalty
