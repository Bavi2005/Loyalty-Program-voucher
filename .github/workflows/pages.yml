name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    env:
      # Point these at the hosted backend (Render/Railway/etc.)
      # Without them the UI will build but API calls will fail at runtime.
      VITE_API_URL: ${{ vars.API_URL }}
      VITE_UPLOADS_URL: ${{ vars.UPLOADS_URL }}
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build SPA
        run: npm run build
        working-directory: frontend

      # SPA fallback: GitHub Pages returns 404 for /receipt-history etc.
      # Copy index.html → 404.html so client-side routing works on refresh.
      - name: Add SPA 404 fallback
        run: cp frontend/dist/index.html frontend/dist/404.html
        if: success()

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
